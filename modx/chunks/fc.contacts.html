  <!-- 6. Контакты -->
  <section class="contacts" id="contacts" data-tone="dark">
    <div class="contacts__inner">
      <div class="contacts__info">
        <h2>Напишите нам</h2>
        <p>Ответим в течение рабочего дня. Быстрее всего в мессенджерах.</p>
        <ul class="channels">
          <li><a class="channel js-phone" href="tel:[[++fc_phone_raw]]">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3h3l1.6 4.4-2 1.4a12 12 0 0 0 6 6l1.4-2L21 14.4v3A2.6 2.6 0 0 1 18.4 20 15.4 15.4 0 0 1 4 5.6 2.6 2.6 0 0 1 6.6 3z"/></svg>
            <span>[[++fc_phone]]</span></a></li>
          <li><a class="channel js-tg" href="[[++fc_telegram_url]]" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11.2l5.6 2 2 6 3-3.6 4.8 3.6L21 4zM8.6 13.2l9-6.2-6.8 7.6"/></svg>
            <span>Telegram</span></a></li>
          <li><a class="channel js-max" href="[[++fc_max_url]]" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/><path d="M8 15V9l4 4 4-4v6"/></svg>
            <span>Max</span></a></li>
          <li><a class="channel js-email" href="mailto:[[++fc_email]]">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
            <span>[[++fc_email]]</span></a></li>
        </ul>
      </div>

      <form class="form" id="leadForm" action="[[~[[*id]]]]" method="post" novalidate data-si-form="fastcup" data-si-preset="fastcup">
        <input type="hidden" name="page" value="[[*pagetitle]] ([[~[[*id]]? &scheme=`full`]])">
        <div class="field">
          <label for="f-name">Имя</label>
          <input id="f-name" name="name" autocomplete="name" required>
          <p class="form__err" data-si-error="name" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="f-phone">Телефон</label>
          <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+7 (___) ___-__-__" maxlength="18" required>
          <p class="form__err" data-si-error="phone" aria-live="polite"></p>
        </div>
        <fieldset class="field topics">
          <legend>Что вас интересует</legend>
          <label><input type="radio" name="topic" value="Установка" checked> Поставить аппарат у себя</label>
          <label><input type="radio" name="topic" value="Обслуживание"> Обслуживание и ремонт</label>
          <label><input type="radio" name="topic" value="Ингредиенты"> Ингредиенты</label>
          <label><input type="radio" name="topic" value="Другое"> Другое</label>
        </fieldset>
        <div class="field">
          <label for="f-msg">Комментарий <span class="opt">необязательно</span></label>
          <textarea id="f-msg" name="message" rows="3"></textarea>
        </div>
        <label class="agree"><input type="checkbox" name="agree" value="1" required> <span>Даю <a href="[[~[[++fc_agree_id]]]]" target="_blank">согласие на обработку персональных данных</a> и принимаю <a href="[[~[[++fc_policy_id]]]]" target="_blank">политику обработки данных</a></span></label>
        <p class="form__err" data-si-error="agree" aria-live="polite"></p>
        <button class="btn btn--sunset" type="submit">Отправить заявку</button>
        <p class="form__status" id="formStatus" role="status"></p>
      </form>
    </div>
  </section>
